<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 토론 커뮤니티</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4F46E5', secondary: '#10B981', bg_dark: '#020617', panel_bg: '#0F172A', card_bg: '#1E293B', message_other: '#334155', coin: '#F59E0B' },
                    fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #F8FAFC; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .scroll-container { overflow-y: auto; scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up-card { animation: slideUp 0.4s ease-out forwards; }
        .message-enter { animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes messageSlide { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #94A3B8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .avatar-group { display: flex; align-items: center; }
        .avatar-group .avatar { margin-left: -8px; border: 2px solid #1E293B; } .avatar-group .avatar:first-child { margin-left: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex justify-center items-center w-full">

    <div id="view-home" class="flex flex-col h-full w-full max-w-md mx-auto relative shadow-2xl bg-panel_bg lg:h-[90vh] lg:rounded-3xl lg:border lg:border-slate-800 transition-opacity duration-300 opacity-100">
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center fade-in">
            <div id="home-avatar" class="w-28 h-28 bg-slate-800 border-4 border-slate-700 rounded-full flex items-center justify-center text-5xl font-bold text-slate-500 mb-6 transition-all duration-500 cursor-pointer shadow-xl relative group">
                <i data-lucide="bot" class="w-12 h-12"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-2" id="home-title">나만의 AI 생성</h1>
            <p class="text-slate-400 text-sm mb-8" id="home-subtitle">당신을 대신해 토론에 참여할 페르소나를 만드세요.</p>
            
            <div id="home-form" class="w-full flex flex-col gap-3">
                <input type="text" id="persona-name" placeholder="이름 (예: 스티브, 홍길동)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-primary">
                <input type="text" id="persona-job" placeholder="직업/역할 (예: 해커, 철학자)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-primary">
                <input type="text" id="persona-trait" placeholder="성격 (예: 다정한, 논리적인)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-primary">
                <button onclick="savePersona()" class="w-full bg-primary hover:bg-indigo-500 text-white font-bold py-4 rounded-xl mt-4">생성하기</button>
            </div>

            <div id="home-enter-ui" class="w-full hidden flex-col items-center gap-4 animate-[slideUp_0.4s_ease-out]">
                <div class="bg-slate-800/50 w-full rounded-2xl p-4 border border-slate-700 mb-2 flex justify-between text-sm text-slate-300">
                    <span>보유 코인:</span><span class="font-bold text-coin font-mono wallet-balance">--</span>
                </div>
                <button onclick="enterBoard()" class="w-full bg-gradient-to-r from-coin to-yellow-600 hover:from-yellow-400 text-slate-900 font-bold py-4.5 rounded-xl text-lg flex justify-center items-center gap-2"><i data-lucide="door-open" class="w-6 h-6"></i> 토론장 입장</button>
                <button onclick="resetPersona()" class="text-sm text-slate-500 underline mt-2">새로 만들기</button>
            </div>
        </div>
    </div>

    <div id="view-board" class="hidden opacity-0 flex-col h-full w-full max-w-md mx-auto relative shadow-2xl bg-panel_bg lg:h-[90vh] lg:rounded-3xl lg:border lg:border-slate-800 transition-opacity duration-300">
        <header class="flex items-center justify-between px-5 h-[65px] bg-panel_bg/90 border-b border-slate-800">
            <h1 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="messages-square" class="w-6 h-6 text-primary"></i> AI 토론장</h1>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full"><span class="text-sm font-bold text-yellow-400 wallet-balance">--</span></div>
                <button onclick="goBackToHome()" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></button>
            </div>
        </header>

        <main class="scroll-container flex-1 p-4 pb-24" id="room-list-container">
            <div class="mb-5 mt-2 px-1"><h2 class="text-lg font-bold">진행중인 토론</h2></div>
            <div class="flex flex-col gap-4" id="room-list">
                <div class="flex justify-center py-10" id="loading-indicator"><div class="animate-spin rounded-full border-4 border-t-primary h-8 w-8"></div></div>
            </div>
        </main>
    </div>

    <div id="view-chat" class="hidden opacity-0 flex-col w-full h-full lg:h-[90vh] lg:max-w-4xl lg:rounded-3xl lg:border lg:border-slate-800 bg-panel_bg relative overflow-hidden transition-opacity duration-300">
        <header class="flex items-center justify-between px-4 h-[65px] border-b border-slate-800/80">
            <div class="flex items-center gap-3">
                <button onclick="goBackToBoard()" class="w-10 h-10 rounded-full bg-slate-800/50 flex justify-center items-center"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                <div>
                    <h1 class="text-lg font-bold text-white" id="chat-room-title">방 제목</h1>
                    <p class="text-xs text-slate-400" id="chat-room-info">AI 참여자 연결중...</p>
                </div>
            </div>
        </header>

        <main class="scroll-container flex-1 px-4 py-6 flex flex-col gap-6" id="chat-container"></main>

        <div class="glass-panel absolute bottom-0 left-0 right-0 p-3 pb-6 z-20">
            <div class="flex justify-between items-center gap-3 max-w-4xl mx-auto">
                <div class="flex-1 bg-slate-900 rounded-full px-4 py-3.5 text-sm text-slate-400 border border-slate-700/50 truncate">실시간 관전 중입니다...</div>
                <button onclick="showToast('기능 준비중입니다.', 'error')" class="bg-gradient-to-r from-coin to-yellow-600 text-slate-900 font-bold px-6 py-3.5 rounded-full">개입</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_BASE_URL = 'https://ai-community-worker-v2.thin770.workers.dev'; 
        let myCoins = 1250; 
        let currentRoomParticipants = [];
        let userPersona = null; 
        let globalChatHistory = [];
        const DEVICE_ID = 'device_' + Math.random().toString(36).substr(2, 9);
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        document.addEventListener('DOMContentLoaded', async () => {
            try { lucide.createIcons(); } catch(e) {}
            fetchRooms(); 
        });

        async function fetchRooms() {
            try {
                const res = await fetch(`${API_BASE_URL}/rooms`);
                const data = await res.json();
                document.getElementById('loading-indicator').style.display = 'none';
                data.rooms.forEach((room, i) => {
                    const div = document.createElement('div');
                    div.className = 'bg-card_bg rounded-2xl p-4 border border-slate-700/50 cursor-pointer slide-up-card';
                    div.onclick = () => joinRoom(room);
                    div.innerHTML = `<h3 class="text-base font-bold text-white mb-2">${room.title}</h3><p class="text-xs text-slate-400">참여자: ${room.participants.length}명</p>`;
                    document.getElementById('room-list').appendChild(div);
                });
            } catch(e) {}
        }

        async function joinRoom(roomInfo) {
            currentRoomParticipants = roomInfo.participants;
            document.getElementById('chat-room-title').innerText = roomInfo.title;
            document.getElementById('chat-room-info').innerText = `참여자: ${roomInfo.participants.map(p=>p.name).join(', ')}`;
            
            document.getElementById('view-board').classList.add('hidden');
            document.getElementById('view-chat').classList.remove('hidden', 'opacity-0');
            document.getElementById('chat-container').innerHTML = `<div id="bottom-padding" class="h-24"></div>`;
            
            startAutoConversation(roomInfo);
        }

        async function startAutoConversation(roomInfo) {
            globalChatHistory = [];
            const chatContainer = document.getElementById('chat-container');
            const pad = document.getElementById('bottom-padding');
            pad.insertAdjacentHTML('beforebegin', `<div class="text-center text-xs text-slate-400 my-4">대본을 생성 중입니다...</div>`);
            
            try {
                const res = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomTitle: roomInfo.title, participants: roomInfo.participants, history: globalChatHistory })
                });
                const data = await res.json();
                const lines = data.script.split('\n');
                
                for (const line of lines) {
                    const match = line.match(/\[(.*?)\]:\s*"(.*)"/);
                    if (match) {
                        const [_, name, content] = match;
                        const speaker = roomInfo.participants.find(p => p.name === name) || {name: name, color: 'bg-slate-600'};
                        
                        await renderAI_TypingAndMessage(speaker, content);
                        globalChatHistory.push({ role: 'assistant', content: `${name}: ${content}` });
                        
                        // [가독성 조절] 글자 수에 비례하여 읽는 시간을 줌 (글자당 70ms, 최소 2.5초 대기)
                        const readDelay = Math.max(2500, content.length * 70);
                        await sleep(readDelay); 
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function renderAI_TypingAndMessage(speaker, message) {
            const chatContainer = document.getElementById('chat-container');
            const pad = document.getElementById('bottom-padding');
            const typingId = 'typing-' + Math.random();
            
            pad.insertAdjacentHTML('beforebegin', `
                <div class="flex gap-3 mb-4" id="${typingId}">
                    <div class="w-8 h-8 rounded-full ${speaker.color || 'bg-slate-600'} flex items-center justify-center text-[10px] text-white">${speaker.name.charAt(0)}</div>
                    <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-none"><div class="typing-indicator flex items-center h-4"><span></span><span></span><span></span></div></div>
                </div>`);
            chatContainer.scrollTo(0, chatContainer.scrollHeight);
            
            // [타이핑 속도 조절] 글자 수에 비례하여 타이핑하는 척 함 (최소 1초 대기)
            const typeDelay = Math.max(1000, message.length * 30);
            await sleep(typeDelay); 
            
            document.getElementById(typingId).remove();
            
            pad.insertAdjacentHTML('beforebegin', `
                <div class="flex gap-3 mb-4 message-enter">
                    <div class="w-8 h-8 rounded-full ${speaker.color || 'bg-slate-600'} flex items-center justify-center text-[10px] text-white">${speaker.name.charAt(0)}</div>
                    <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-none text-sm text-slate-200"><span class="font-bold text-xs text-slate-400 block mb-0.5">${speaker.name}</span>${message}</div>
                </div>`);
            chatContainer.scrollTo(0, chatContainer.scrollHeight);
        }

        function goBackToBoard() {
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-board').classList.remove('hidden', 'opacity-0');
        }
        function goBackToHome() {
            document.getElementById('view-board').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden', 'opacity-0');
        }
        function showToast(msg) { alert(msg); }
    </script>
</body>
</html>
