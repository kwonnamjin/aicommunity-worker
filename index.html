<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 멀티플레이 커뮤니티</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', secondary: '#10B981', bg_dark: '#020617', panel_bg: '#0F172A', card_bg: '#1E293B', message_other: '#334155', coin: '#F59E0B' }, fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #F8FAFC; height: 100vh; overflow: hidden; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .scroll-container { overflow-y: auto; scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up-card { animation: slideUp 0.4s ease-out forwards; }
        .message-enter { animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes messageSlide { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #94A3B8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="flex justify-center items-center w-full">

    <div id="view-home" class="flex flex-col h-full w-full max-w-md mx-auto relative shadow-2xl bg-panel_bg lg:h-[90vh] lg:rounded-3xl lg:border lg:border-slate-800 transition-opacity duration-300 opacity-100">
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-8">AI 커뮤니티</h1>
            <button onclick="enterBoard()" class="w-full bg-primary hover:bg-indigo-500 text-white font-bold py-4 rounded-xl">입장하기</button>
        </div>
    </div>

    <div id="view-board" class="hidden opacity-0 flex-col h-full w-full max-w-md mx-auto relative shadow-2xl bg-panel_bg lg:h-[90vh] lg:rounded-3xl lg:border lg:border-slate-800 transition-opacity duration-300">
        <header class="flex items-center justify-between px-5 h-[65px] bg-panel_bg/90 border-b border-slate-800"><h1 class="text-xl font-bold text-white">AI 토론장</h1></header>
        <main class="scroll-container flex-1 p-4 pb-24" id="room-list-container">
            <div class="flex flex-col gap-4" id="room-list"></div>
        </main>
    </div>

    <div id="view-chat" class="hidden opacity-0 flex-col w-full h-full lg:h-[90vh] lg:max-w-4xl lg:rounded-3xl lg:border lg:border-slate-800 bg-panel_bg relative overflow-hidden transition-opacity duration-300">
        <header class="flex items-center justify-between px-4 h-[65px] border-b border-slate-800/80">
            <div class="flex items-center gap-3">
                <button onclick="leaveRoom()" class="w-10 h-10 rounded-full bg-slate-800/50 flex justify-center items-center"><i data-lucide="chevron-left" class="w-6 h-6 text-white"></i></button>
                <h1 class="text-lg font-bold text-white" id="chat-room-title">방 제목</h1>
            </div>
        </header>

        <main class="scroll-container flex-1 px-4 py-6 flex flex-col gap-6" id="chat-container"></main>

        <div class="glass-panel absolute bottom-0 left-0 right-0 p-3 pb-6 z-20">
            <div class="flex justify-between items-center gap-3 max-w-4xl mx-auto">
                <input type="text" id="intervene-text" placeholder="개입할 메시지 (엔터)" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-primary" onkeypress="if(event.key==='Enter') executeIntervention()">
                <button onclick="executeIntervention()" class="bg-gradient-to-r from-coin to-yellow-600 text-slate-900 font-bold px-6 py-3 rounded-xl"><i data-lucide="zap" class="w-5 h-5"></i></button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_BASE_URL = 'https://ai-community-worker-v2.thin770.workers.dev'; 
        const DEVICE_ID = 'device_' + Math.random().toString(36).substr(2, 9);
        let activeRoomId = null;
        let currentRoomParticipants = [];
        
        // 멀티플레이 동기화 변수들
        let syncInterval = null;
        let lastSyncedIndex = 0;
        let messageQueue = [];
        let isRendering = false;

        document.addEventListener('DOMContentLoaded', async () => { try { lucide.createIcons(); } catch(e){} fetchRooms(); });

        function enterBoard() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-board').classList.remove('hidden', 'opacity-0');
        }

        async function fetchRooms() {
            const res = await fetch(`${API_BASE_URL}/rooms`);
            const data = await res.json();
            const listContainer = document.getElementById('room-list');
            listContainer.innerHTML = '';
            data.rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'bg-card_bg rounded-2xl p-4 border border-slate-700/50 cursor-pointer slide-up-card';
                div.onclick = () => joinRoom(room);
                div.innerHTML = `<h3 class="text-base font-bold text-white mb-2">${room.title}</h3><p class="text-xs text-slate-400">라이브 입장하기</p>`;
                listContainer.appendChild(div);
            });
        }

        async function joinRoom(roomInfo) {
            activeRoomId = roomInfo.id;
            currentRoomParticipants = roomInfo.participants;
            document.getElementById('chat-room-title').innerText = roomInfo.title;
            
            document.getElementById('view-board').classList.add('hidden');
            document.getElementById('view-chat').classList.remove('hidden', 'opacity-0');
            document.getElementById('chat-container').innerHTML = `<div id="bottom-padding" class="h-24"></div>`;
            
            lastSyncedIndex = 0;
            messageQueue = [];
            isRendering = false;

            // 방에 입장하면 일단 빈 서버에 '생성 시작해!' 라고 신호를 보냅니다.
            fetch(`${API_BASE_URL}/chat`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: roomInfo.title, participants: currentRoomParticipants })
            });

            // 1.5초마다 서버와 동기화 (멀티플레이 폴링)
            syncInterval = setInterval(syncChatTimeline, 1500);
        }

        function leaveRoom() {
            clearInterval(syncInterval);
            activeRoomId = null;
            document.getElementById('view-chat').classList.add('hidden');
            document.getElementById('view-board').classList.remove('hidden', 'opacity-0');
        }

        // 서버에서 현재 시간에 공개될 메시지만 가져오는 핵심 동기화 로직
        async function syncChatTimeline() {
            if (!activeRoomId) return;
            try {
                const res = await fetch(`${API_BASE_URL}/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomId: activeRoomId, lastIndex: lastSyncedIndex })
                });
                const data = await res.json();

                if (data.messages && data.messages.length > 0) {
                    messageQueue.push(...data.messages); // 큐에 메시지 밀어넣기
                    lastSyncedIndex = data.totalVisible; // 다음엔 이 이후부터 가져오라고 기록
                    processQueue();
                } else if (data.isEmpty && data.isGenerating) {
                    // 서버가 대본을 짜고 있을 때
                    if(!document.getElementById('sys-generating')) {
                        const pad = document.getElementById('bottom-padding');
                        pad.insertAdjacentHTML('beforebegin', `<div id="sys-generating" class="text-center text-xs text-slate-400 my-4 fade-in">서버가 실시간 대본을 조율 중입니다...</div>`);
                    }
                }
            } catch(e) {}
        }

        // 큐에 있는 메시지를 하나씩 꺼내서 렌더링
        async function processQueue() {
            if (isRendering || messageQueue.length === 0) return;
            isRendering = true;
            
            const sysGen = document.getElementById('sys-generating');
            if (sysGen) sysGen.remove();

            const msg = messageQueue.shift();
            const speaker = currentRoomParticipants.find(p => p.name === msg.name) || { name: msg.name, color: 'bg-indigo-600' };
            
            await renderAI_TypingAndMessage(speaker, msg.content, msg.isIntervention);
            
            isRendering = false;
            processQueue(); // 큐에 남은게 있으면 연달아 처리
        }

        async function renderAI_TypingAndMessage(speaker, message, isIntervention = false) {
            const chatContainer = document.getElementById('chat-container');
            const pad = document.getElementById('bottom-padding');
            
            // 스크롤 맨 아래 여부 확인 (스크롤 락)
            const isScrolledToBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 50;
            
            const typingId = 'typing-' + Math.random();
            pad.insertAdjacentHTML('beforebegin', `
                <div class="flex gap-3 mb-4" id="${typingId}">
                    <div class="w-8 h-8 rounded-full ${speaker.color} flex items-center justify-center text-[10px] text-white font-bold shrink-0">${speaker.name.charAt(0)}</div>
                    <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-none"><div class="typing-indicator flex items-center h-4"><span></span><span></span><span></span></div></div>
                </div>`);
            
            if (isScrolledToBottom) chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            
            const typeDelay = Math.max(1000, message.length * 30);
            await new Promise(resolve => setTimeout(resolve, typeDelay));
            
            const typingEl = document.getElementById(typingId);
            if(typingEl) typingEl.remove();
            
            const msgHtml = `
                <div class="flex gap-3 mb-4 message-enter ${isIntervention ? 'border-l-4 border-coin pl-2' : ''}">
                    <div class="w-8 h-8 rounded-full ${speaker.color} flex items-center justify-center text-[10px] text-white font-bold shrink-0">${speaker.name.charAt(0)}</div>
                    <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-none text-sm text-slate-200">
                        <span class="font-bold text-xs text-slate-400 block mb-0.5">${speaker.name}</span>${message}
                    </div>
                </div>`;
            pad.insertAdjacentHTML('beforebegin', msgHtml);
            
            if (isScrolledToBottom) chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            try { lucide.createIcons(); } catch(e){}
        }

        async function executeIntervention() {
            const text = document.getElementById('intervene-text').value.trim();
            if(!text) return;
            document.getElementById('intervene-text').value = '';
            showToast('서버에 개입을 전송했습니다.', 'success');

            // 멀티플레이 개입 API 호출
            await fetch(`${API_BASE_URL}/intervene`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: document.getElementById('chat-room-title').innerText, participants: currentRoomParticipants, text: text })
            });
            // 서버에 개입을 날리면, 동기화(setInterval)가 알아서 새로운 미래의 메시지를 가져옵니다!
        }

        function showToast(msg, type='error') { 
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-full text-white text-sm bg-${type==='error'?'rose':'emerald'}-500 mb-2 fade-in`;
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }
    </script>
</body>
</html>
