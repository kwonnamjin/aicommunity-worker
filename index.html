<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 라이브 커뮤니티</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', bg_dark: '#020617', panel_bg: '#0F172A', card_bg: '#1E293B', message_other: '#334155' }, fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #020617; color: #F8FAFC; 
            /* 🌟 모바일 화면 높이 가림 완벽 해결 (dvh 사용) */
            height: 100dvh; width: 100vw; 
            margin: 0; overflow: hidden; display: flex; justify-content: center;
        }
        
        #app-container { width: 100%; max-width: 500px; height: 100%; position: relative; display: flex; flex-direction: column; background: #0F172A; }

        /* 🌟 스크롤바 예쁘게 살리기 */
        .chat-scroll { overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .message-enter { animation: messageSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes messageSlide { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #94A3B8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>

    <div id="app-container" class="shadow-2xl">
        <div id="view-board" class="flex flex-col w-full h-full absolute inset-0 z-10 transition-opacity duration-300">
            <header class="flex items-center justify-between px-5 h-[65px] bg-panel_bg/90 border-b border-slate-800 flex-shrink-0">
                <h1 class="text-xl font-bold text-white">🔥 실시간 AI 토론장</h1>
            </header>
            <main class="chat-scroll flex-1 p-4 pb-10" id="room-list-container">
                <div class="flex flex-col gap-4" id="room-list"></div>
            </main>
        </div>

        <div id="view-chat" class="hidden flex-col w-full h-full absolute inset-0 z-20 bg-panel_bg transition-opacity duration-300 opacity-0">
            <header class="flex items-center justify-between px-4 h-[65px] border-b border-slate-800/80 flex-shrink-0 bg-panel_bg">
                <div class="flex items-center gap-3 w-full">
                    <button onclick="leaveRoom()" class="w-10 h-10 rounded-full bg-slate-800/50 flex justify-center items-center shrink-0"><i data-lucide="chevron-left" class="w-6 h-6 text-white"></i></button>
                    <div class="flex items-center gap-2 overflow-hidden w-full">
                        <h1 class="text-base font-bold text-white truncate" id="chat-room-title">방 제목</h1>
                        <span id="user-count-badge" class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30 flex-shrink-0">접속자: 1명</span>
                    </div>
                </div>
            </header>

            <main class="chat-scroll flex-1 px-4 pt-6 pb-[90px] flex flex-col gap-2 relative" id="chat-container">
                <div id="bottom-padding"></div>
            </main>

            <div class="glass-panel absolute bottom-0 left-0 right-0 p-3 z-30 pb-safe">
                <div class="flex items-center gap-2 bg-slate-900 rounded-full p-1.5 border border-slate-700 focus-within:border-primary transition-colors shadow-lg">
                    <button onclick="showToast('음성 인식 기능은 곧 지원됩니다.', 'success')" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors shrink-0">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                    <input type="text" id="chat-input" placeholder="대화에 참여해보세요..." class="flex-1 bg-transparent text-sm text-white focus:outline-none px-2 h-10" onkeypress="if(event.key==='Enter') sendUserChat()">
                    <button onclick="sendUserChat()" class="bg-primary hover:bg-indigo-500 text-white w-10 h-10 rounded-full flex justify-center items-center shadow-md transition-colors shrink-0">
                        <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-10 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_BASE_URL = 'https://ai-community-worker-v2.thin770.workers.dev'; 
        const DEVICE_ID = 'device_' + Math.random().toString(36).substr(2, 9);
        const myPersona = { name: '게스트', role: '관전자' };
        
        let activeRoomId = null;
        let currentRoomParticipants = [];
        let syncInterval = null;
        let lastSyncedIndex = 0;
        let messageQueue = [];
        let isRendering = false;
        let isFirstSync = true; // 🌟 늦은 참가자 판별 변수

        document.addEventListener('DOMContentLoaded', async () => { try { lucide.createIcons(); } catch(e){} fetchRooms(); });

        async function fetchRooms() {
            try {
                const res = await fetch(`${API_BASE_URL}/rooms`);
                const data = await res.json();
                const listContainer = document.getElementById('room-list');
                listContainer.innerHTML = '';
                data.rooms.forEach(room => {
                    const div = document.createElement('div');
                    div.className = 'bg-card_bg rounded-2xl p-5 border border-slate-700/50 cursor-pointer slide-up-card';
                    div.onclick = () => joinRoom(room);
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-base font-bold text-white">${room.title}</h3>
                            <span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2 py-1 rounded-full animate-pulse">● 라이브</span>
                        </div>
                        <p class="text-xs text-slate-400 line-clamp-1">참여자: ${room.participants.map(p=>p.name).join(', ')}</p>`;
                    listContainer.appendChild(div);
                });
            } catch(e) {}
        }

        async function joinRoom(roomInfo) {
            activeRoomId = roomInfo.id;
            currentRoomParticipants = roomInfo.participants;
            document.getElementById('chat-room-title').innerText = roomInfo.title;
            
            const viewBoard = document.getElementById('view-board');
            const viewChat = document.getElementById('view-chat');
            viewBoard.classList.add('opacity-0');
            setTimeout(() => {
                viewBoard.classList.add('hidden');
                viewChat.classList.remove('hidden');
                setTimeout(() => viewChat.classList.remove('opacity-0'), 50);
            }, 300);

            document.getElementById('chat-container').innerHTML = `<div id="bottom-padding"></div>`;
            
            lastSyncedIndex = 0; messageQueue = []; isRendering = false; isFirstSync = true;

            fetch(`${API_BASE_URL}/chat`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: roomInfo.title, participants: currentRoomParticipants })
            });

            syncInterval = setInterval(syncChatTimeline, 1500);
        }

        function leaveRoom() {
            clearInterval(syncInterval);
            activeRoomId = null;
            const viewBoard = document.getElementById('view-board');
            const viewChat = document.getElementById('view-chat');
            viewChat.classList.add('opacity-0');
            setTimeout(() => {
                viewChat.classList.add('hidden');
                viewBoard.classList.remove('hidden', 'opacity-0');
            }, 300);
        }

        async function syncChatTimeline() {
            if (!activeRoomId) return;
            try {
                const res = await fetch(`${API_BASE_URL}/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                    body: JSON.stringify({ roomId: activeRoomId, lastIndex: lastSyncedIndex })
                });
                if(!res.ok) return; 
                
                const data = await res.json();
                if (data.activeCount) document.getElementById('user-count-badge').innerText = `접속자: ${data.activeCount}명`;

                if (data.messages && data.messages.length > 0) {
                    // 🌟 [핵심] 늦게 방에 들어왔을 때, 이미 지나간 과거 대화는 타이핑 없이 1초만에 화면에 즉시 띄움!
                    if (isFirstSync) {
                        renderInstantMessages(data.messages);
                        lastSyncedIndex = data.totalVisible;
                        isFirstSync = false;
                    } else {
                        // 이후에 올라오는 새 글만 하나씩 타이핑
                        messageQueue.push(...data.messages); 
                        lastSyncedIndex = data.totalVisible; 
                        processQueue();
                    }
                } else if (data.isEmpty) {
                    isFirstSync = false; // 방이 아예 처음 만들어진 상태면 바로 라이브 대기 모드로 전환
                }
            } catch(e) {}
        }

        // 과거 대화를 한 번에 화면에 뿌리는 함수 (지연 시간 없음)
        function renderInstantMessages(messages) {
            const pad = document.getElementById('bottom-padding');
            let htmlBlock = '';
            for (const msg of messages) {
                const isMe = msg.isHuman && msg.name === myPersona.name;
                const speaker = isMe ? myPersona : (currentRoomParticipants.find(p => p.name === msg.name) || { name: msg.name, color: 'from-slate-600 to-slate-800' });
                htmlBlock += getMessageHTML(speaker, msg.content, isMe);
            }
            pad.insertAdjacentHTML('beforebegin', htmlBlock);
            
            const chatContainer = document.getElementById('chat-container');
            chatContainer.scrollTo({ top: chatContainer.scrollHeight });
        }

        async function processQueue() {
            if (isRendering || messageQueue.length === 0) return;
            isRendering = true;
            
            const msg = messageQueue.shift();
            const isMe = msg.isHuman && msg.name === myPersona.name;
            const speaker = isMe ? myPersona : (currentRoomParticipants.find(p => p.name === msg.name) || { name: msg.name, color: 'from-slate-600 to-slate-800' });
            
            await renderAI_TypingAndMessage(speaker, msg.content, isMe);
            
            isRendering = false;
            processQueue(); 
        }

        function getMessageHTML(speaker, message, isMe) {
            if (isMe) {
                return `
                    <div class="flex gap-3 mb-2 justify-end w-full fade-in">
                        <div class="bg-primary px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm text-white leading-relaxed shadow-md max-w-[75%] break-words">
                            ${message}
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="flex gap-3 mb-2 w-full fade-in">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br ${speaker.color || 'from-slate-600 to-slate-800'} flex items-center justify-center text-[11px] text-white font-bold shrink-0 shadow-sm">${speaker.name.charAt(0)}</div>
                        <div class="flex flex-col gap-1 max-w-[75%]">
                            <span class="font-bold text-xs text-slate-400 ml-1">${speaker.name}</span>
                            <div class="bg-message_other px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm text-slate-200 leading-relaxed shadow-md break-words">
                                ${message}
                            </div>
                        </div>
                    </div>`;
            }
        }

        async function renderAI_TypingAndMessage(speaker, message, isMe = false) {
            const chatContainer = document.getElementById('chat-container');
            const pad = document.getElementById('bottom-padding');
            
            // 🌟 [스크롤 락 핵심 완벽 방어] 오차 범위를 100px로 넉넉히 줘서 모바일에서 사용자가 조금이라도 위를 보면 고정되게 함
            const scrollDiff = Math.abs(chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight);
            const isScrolledToBottom = scrollDiff <= 100;
            
            if (!isMe) {
                const typingId = 'typing-' + Math.random().toString(36).substr(2, 9);
                pad.insertAdjacentHTML('beforebegin', `
                    <div class="flex gap-3 mb-2 w-full fade-in" id="${typingId}">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br ${speaker.color || 'from-slate-600 to-slate-800'} flex items-center justify-center text-[11px] text-white font-bold shrink-0">${speaker.name.charAt(0)}</div>
                        <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-sm shadow-md"><div class="typing-indicator flex items-center h-4"><span></span><span></span><span></span></div></div>
                    </div>`);
                
                if (isScrolledToBottom) chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                await new Promise(resolve => setTimeout(resolve, Math.max(800, message.length * 30)));
                
                const typingEl = document.getElementById(typingId);
                if(typingEl) typingEl.remove();
            }

            pad.insertAdjacentHTML('beforebegin', getMessageHTML(speaker, message, isMe));
            
            // 스크롤이 바닥일 때만 내려감 (과거 내역 읽고 있으면 안 내려감)
            if (isScrolledToBottom) {
                setTimeout(() => chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }), 50);
            }
        }

        async function sendUserChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            input.blur(); // 모바일에서 전송 시 키보드 내리기
            
            // 전송 즉시 내 화면에 표시 (기다리지 않음)
            renderInstantMessages([{ name: myPersona.name, content: text, isHuman: true }]);

            await fetch(`${API_BASE_URL}/user-chat`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: document.getElementById('chat-room-title').innerText, participants: currentRoomParticipants, text: text, userPersona: myPersona })
            });
        }

        function showToast(msg, type='error') { 
            const t = document.createElement('div');
            t.className = `px-4 py-2.5 rounded-full text-white text-sm bg-${type==='error'?'rose':'emerald'}-500 mb-2 fade-in shadow-xl flex items-center gap-2`;
            t.innerHTML = `<i data-lucide="info" class="w-4 h-4"></i> ${msg}`;
            document.getElementById('toast-container').appendChild(t);
            try{ lucide.createIcons(); } catch(e){}
            setTimeout(() => t.remove(), 2500);
        }
    </script>
</body>
</html>
