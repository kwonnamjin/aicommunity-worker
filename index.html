<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 라이브 커뮤니티</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', bg_dark: '#020617', panel_bg: '#0F172A', card_bg: '#1E293B', message_other: '#334155' }, fontFamily: { sans: ['Pretendard', '-apple-system', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #020617; color: #F8FAFC; height: 100dvh; width: 100vw; margin: 0; display: flex; justify-content: center; overflow: hidden; }
        #app-container { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; background: #0F172A; position: relative; }
        .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-track { background: transparent; }
        .scroll-area::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #94A3B8; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="app-container" class="shadow-2xl">
        
        <div id="view-home" class="flex flex-col w-full h-full p-6 text-center justify-center">
            <h1 class="text-3xl font-bold text-white mb-2">AI 토론장</h1>
            <p class="text-slate-400 mb-8">모드별로 다른 AI의 반응을 확인해보세요.</p>
            <button onclick="enterBoard()" class="w-full bg-primary hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95">입장하기</button>
        </div>

        <div id="view-board" class="hidden flex-col w-full h-full">
            <header class="flex items-center justify-between px-5 h-[65px] border-b border-slate-800 shrink-0">
                <h1 class="text-xl font-bold text-white">채팅방 목록</h1>
            </header>
            <main class="scroll-area p-4" id="room-list-container">
                <div class="flex flex-col gap-4" id="room-list"></div>
            </main>
        </div>

        <div id="view-chat" class="hidden flex-col w-full h-full relative">
            <header class="flex items-center justify-between px-4 h-[65px] border-b border-slate-800 shrink-0 bg-panel_bg z-10">
                <div class="flex items-center gap-3 w-full">
                    <button onclick="leaveRoom()" class="w-10 h-10 rounded-full hover:bg-slate-800 flex justify-center items-center shrink-0 transition-colors"><i data-lucide="chevron-left" class="w-6 h-6 text-white"></i></button>
                    <div class="flex flex-col overflow-hidden w-full">
                        <h1 class="text-base font-bold text-white truncate" id="chat-room-title">방 제목</h1>
                        <span id="user-count-badge" class="text-xs text-emerald-400 font-medium">접속자: 1명</span>
                    </div>
                </div>
            </header>

            <main class="scroll-area px-4 pt-6 pb-4 flex flex-col gap-2 relative" id="chat-container">
                <div id="bottom-padding"></div>
            </main>

            <div class="p-3 bg-panel_bg border-t border-slate-800 shrink-0 z-10 pb-safe">
                <div class="flex items-center gap-2 bg-slate-900 rounded-full p-1.5 border border-slate-700">
                    <button onclick="showToast('음성 인식 기능은 준비 중입니다.', 'success')" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors shrink-0">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                    <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." class="flex-1 bg-transparent text-sm text-white focus:outline-none px-2 h-10" onkeypress="if(event.key==='Enter') sendUserChat()">
                    <button onclick="sendUserChat()" class="bg-primary hover:bg-indigo-500 text-white w-10 h-10 rounded-full flex justify-center items-center shadow-md transition-colors shrink-0">
                        <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast-container" class="fixed top-10 left-1/2 transform -translate-x-1/2 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <script>
        const API_BASE_URL = 'https://ai-community-worker-v2.thin770.workers.dev'; 
        const DEVICE_ID = 'device_' + Math.random().toString(36).substr(2, 9);
        const myPersona = { name: '게스트', role: '관전자' }; 
        
        let activeRoomId = null;
        let currentRoomMode = null; // 🌟 현재 방 모드 기억
        let currentRoomParticipants = [];
        let syncInterval = null;
        let lastSyncedIndex = 0;
        let messageQueue = [];
        let isRendering = false;
        let isFirstSync = true; 

        document.addEventListener('DOMContentLoaded', async () => { try { lucide.createIcons(); } catch(e){} fetchRooms(); });

        function switchView(viewId) {
            ['view-home', 'view-board', 'view-chat'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById(viewId).classList.add('flex');
        }

        function enterBoard() { switchView('view-board'); }
        function leaveRoom() {
            clearInterval(syncInterval);
            activeRoomId = null;
            switchView('view-board');
        }

        async function fetchRooms() {
            try {
                const res = await fetch(`${API_BASE_URL}/rooms`);
                const data = await res.json();
                const listContainer = document.getElementById('room-list');
                listContainer.innerHTML = '';
                data.rooms.forEach(room => {
                    const div = document.createElement('div');
                    div.className = 'bg-card_bg rounded-2xl p-5 border border-slate-700/50 cursor-pointer fade-in';
                    div.onclick = () => joinRoom(room);
                    
                    // 🌟 방 모드별 배지 색상 다르게 표시
                    let badgeHTML = '';
                    if (room.mode === 'relay') badgeHTML = `<span class="text-[10px] text-rose-400 font-bold bg-rose-500/10 px-2 py-1 rounded-full animate-pulse">1호출 1대답</span>`;
                    else if (room.mode === 'batch') badgeHTML = `<span class="text-[10px] text-indigo-400 font-bold bg-indigo-500/10 px-2 py-1 rounded-full">시나리오 (다중대답)</span>`;
                    else badgeHTML = `<span class="text-[10px] text-slate-400 font-bold bg-slate-500/10 px-2 py-1 rounded-full">공사중</span>`;

                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-base font-bold text-white">${room.title}</h3>
                            ${badgeHTML}
                        </div>
                        <p class="text-xs text-slate-400 line-clamp-1">참여자: ${room.participants.length > 0 ? room.participants.map(p=>p.name).join(', ') : '없음'}</p>`;
                    listContainer.appendChild(div);
                });
            } catch(e) {}
        }

        async function joinRoom(roomInfo) {
            activeRoomId = roomInfo.id;
            currentRoomMode = roomInfo.mode; // 모드 저장
            currentRoomParticipants = roomInfo.participants;
            document.getElementById('chat-room-title').innerText = roomInfo.title;
            document.getElementById('user-count-badge').innerText = `접속자: 1명`; 
            
            document.getElementById('chat-container').innerHTML = `<div id="bottom-padding"></div>`;
            switchView('view-chat');
            
            lastSyncedIndex = 0; messageQueue = []; isRendering = false; isFirstSync = true;

            // 🌟 3번방(공사중)은 호출 안함
            if (currentRoomMode === 'hold') {
                renderInstantMessages([{ name: '시스템', content: '이 방은 현재 보류중/공사중입니다. 채팅을 치셔도 AI가 답하지 않습니다.', isHuman: true }]);
                return;
            }

            fetch(`${API_BASE_URL}/chat`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: roomInfo.title, participants: currentRoomParticipants, mode: currentRoomMode })
            });

            syncInterval = setInterval(syncChatTimeline, 1500);
        }

        async function syncChatTimeline() {
            if (!activeRoomId || currentRoomMode === 'hold') return;
            try {
                const res = await fetch(`${API_BASE_URL}/sync`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                    body: JSON.stringify({ roomId: activeRoomId, lastIndex: lastSyncedIndex })
                });
                if(!res.ok) return; 
                
                const data = await res.json();
                if (data.activeCount) document.getElementById('user-count-badge').innerText = `접속자: ${data.activeCount}명`;

                if (data.messages && data.messages.length > 0) {
                    if (isFirstSync) {
                        renderInstantMessages(data.messages);
                        lastSyncedIndex = data.totalVisible;
                        isFirstSync = false;
                    } else {
                        messageQueue.push(...data.messages); 
                        lastSyncedIndex = data.totalVisible; 
                        processQueue();
                    }
                } else if (data.isEmpty) {
                    isFirstSync = false; 
                }

                // 🌟 [핵심] 릴레이 모드 무한 자동 트리거
                const allRevealed = (data.totalVisible === data.totalMessages);
                if (currentRoomMode === 'relay' && !data.isGenerating && allRevealed && messageQueue.length === 0) {
                    // 할 말이 다 떨어졌으면 서버에 "다음 1줄 줘!" 라고 요청
                    fetch(`${API_BASE_URL}/chat`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                        body: JSON.stringify({ roomId: activeRoomId, roomTitle: document.getElementById('chat-room-title').innerText, participants: currentRoomParticipants, mode: 'relay' })
                    });
                }

                // 상태 텍스트
                if (data.isGenerating) {
                    if(!document.getElementById('sys-generating')) {
                        const msg = currentRoomMode === 'relay' ? 'AI가 다음 반응을 생각 중입니다...' : 'AI가 시나리오를 짜는 중입니다...';
                        document.getElementById('bottom-padding').insertAdjacentHTML('beforebegin', `<div id="sys-generating" class="text-center text-[11px] text-slate-500 my-4 fade-in">${msg}</div>`);
                        scrollToBottom();
                    }
                } else {
                    const sysGen = document.getElementById('sys-generating');
                    if (sysGen && messageQueue.length === 0) sysGen.remove();
                }

            } catch(e) {}
        }

        function renderInstantMessages(messages) {
            const pad = document.getElementById('bottom-padding');
            let htmlBlock = '';
            for (const msg of messages) {
                const isMe = msg.isHuman && msg.name === myPersona.name;
                const speaker = isMe ? myPersona : (currentRoomParticipants.find(p => p.name === msg.name) || { name: msg.name, color: 'from-slate-600 to-slate-800' });
                htmlBlock += getMessageHTML(speaker, msg.content, isMe);
            }
            pad.insertAdjacentHTML('beforebegin', htmlBlock);
            scrollToBottom(true);
        }

        async function processQueue() {
            if (isRendering || messageQueue.length === 0) return;
            isRendering = true;
            
            const sysGen = document.getElementById('sys-generating');
            if (sysGen) sysGen.remove();

            const msg = messageQueue.shift();
            const isMe = msg.isHuman && msg.name === myPersona.name;
            const speaker = isMe ? myPersona : (currentRoomParticipants.find(p => p.name === msg.name) || { name: msg.name, color: 'from-slate-600 to-slate-800' });
            
            await renderAI_TypingAndMessage(speaker, msg.content, isMe);
            
            isRendering = false;
            processQueue(); 
        }

        function getMessageHTML(speaker, message, isMe) {
            if (isMe) {
                return `
                    <div class="flex gap-2 mb-3 justify-end w-full fade-in">
                        <div class="bg-primary px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm text-white leading-relaxed shadow max-w-[75%] break-words">
                            ${message}
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="flex gap-2 mb-3 w-full fade-in">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br ${speaker.color || 'from-slate-600 to-slate-800'} flex items-center justify-center text-[11px] text-white font-bold shrink-0 shadow">${speaker.name.charAt(0)}</div>
                        <div class="flex flex-col gap-1 max-w-[75%]">
                            <span class="font-bold text-[11px] text-slate-400 ml-1">${speaker.name}</span>
                            <div class="bg-message_other px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm text-slate-200 leading-relaxed shadow break-words">
                                ${message}
                            </div>
                        </div>
                    </div>`;
            }
        }

        function scrollToBottom(force = false) {
            const container = document.getElementById('chat-container');
            const scrollDiff = Math.abs(container.scrollHeight - container.scrollTop - container.clientHeight);
            if (force || scrollDiff <= 100) {
                container.scrollTo({ top: container.scrollHeight, behavior: force ? 'auto' : 'smooth' });
            }
        }

        async function renderAI_TypingAndMessage(speaker, message, isMe = false) {
            const pad = document.getElementById('bottom-padding');
            
            if (!isMe) {
                const typingId = 'typing-' + Math.random().toString(36).substr(2, 9);
                pad.insertAdjacentHTML('beforebegin', `
                    <div class="flex gap-2 mb-3 w-full fade-in" id="${typingId}">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br ${speaker.color || 'from-slate-600 to-slate-800'} flex items-center justify-center text-[11px] text-white font-bold shrink-0 shadow">${speaker.name.charAt(0)}</div>
                        <div class="bg-message_other px-4 py-3 rounded-2xl rounded-tl-sm shadow"><div class="typing-indicator flex items-center h-4"><span></span><span></span><span></span></div></div>
                    </div>`);
                
                scrollToBottom();
                await new Promise(resolve => setTimeout(resolve, Math.max(800, message.length * 30)));
                
                const typingEl = document.getElementById(typingId);
                if(typingEl) typingEl.remove();
            }

            pad.insertAdjacentHTML('beforebegin', getMessageHTML(speaker, message, isMe));
            scrollToBottom();
        }

        async function sendUserChat() {
            if (currentRoomMode === 'hold') {
                showToast('공사중인 방에서는 채팅을 보낼 수 없습니다.', 'error');
                return;
            }

            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            input.blur(); 
            
            renderInstantMessages([{ name: myPersona.name, content: text, isHuman: true }]);

            await fetch(`${API_BASE_URL}/user-chat`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Device-ID': DEVICE_ID },
                body: JSON.stringify({ roomId: activeRoomId, roomTitle: document.getElementById('chat-room-title').innerText, participants: currentRoomParticipants, text: text, userPersona: myPersona, mode: currentRoomMode })
            });
        }

        function showToast(msg, type='error') { 
            const t = document.createElement('div');
            t.className = `px-4 py-2.5 rounded-full text-white text-sm bg-${type==='error'?'rose':'emerald'}-500 mb-2 fade-in shadow-xl flex items-center gap-2`;
            t.innerHTML = `<i data-lucide="info" class="w-4 h-4"></i> ${msg}`;
            document.getElementById('toast-container').appendChild(t);
            try{ lucide.createIcons(); } catch(e){}
            setTimeout(() => t.remove(), 2000);
        }
    </script>
</body>
</html>
